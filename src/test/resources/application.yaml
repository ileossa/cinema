spring:
  datasource:
    url: jdbc:h2:mem:cinematest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

rustfs:
  url: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket-name: cinema-media
  region: us-east-1
