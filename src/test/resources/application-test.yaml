spring:
  datasource:
    url: jdbc:h2:mem:cinema_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    clean-disabled: false

rustfs:
  url: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket-name: cinema-media
  region: us-east-1
