spring:
  postgresql:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_db}
    username: ${SPRING_DATASOURCE_USERNAME:cinema_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cinema_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate #car j'utilise flyway, donc pas besoin d'avoir une génération des table sql depuis les entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true

rustfs:
  url: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket-name: cinema-media
  region: us-east-1